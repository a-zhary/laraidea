x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

x-security: &security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:noexec,nosuid,size=100m

services:
  app:
    <<: *security
    <<: *logging
    build:
      target: production
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    cpu_shares: 512
    pids_limit: 100
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    <<: *security
    <<: *logging
    image: postgres:17-alpine
    mem_limit: 256m
    cpu_shares: 256
    pids_limit: 50
    environment:
      - POSTGRES_DB=laraidea
      - POSTGRES_USER=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laraidea"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  backend:
    driver: bridge
    internal: true
