name: laraidea

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

services:
  app:
    <<: *logging
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: laraidea/app:${TAG:-latest}
    container_name: laraidea-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - LOG_CHANNEL=stderr
    volumes:
      # Персистируем базу данных между редеплоями
      - sqlite_data:/var/www/html/database
      # Персистируем storage (загрузки пользователей, сессии, логи)
      - storage_data:/var/www/html/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
  storage_data:
    driver: local
