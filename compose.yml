name: laraidea

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: laraidea/app:${TAG:-latest}
    container_name: laraidea-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
    volumes:
      - database:/var/www/html/database
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  database:
    driver: local
